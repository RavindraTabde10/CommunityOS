# Production-ready docker-compose with optimizations, health checks, and resource limits

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # For production, use buildkit for better caching
      # DOCKER_BUILDKIT=1 docker compose build
    container_name: communityos-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - backend_data:/app/data
      # Remove or comment out the next line in production
      - ./backend/app:/app/app  # Hot reload for development only
    networks:
      - communityos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Production: uncomment to set memory and CPU limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api/v1"
    container_name: communityos-frontend
    restart: unless-stopped
    ports:
      - "80:80"  # Change from 5173:80 to standard HTTP port
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - communityos-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Production: uncomment to set memory and CPU limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  backend_data:
    driver: local

networks:
  communityos-network:
    driver: bridge
